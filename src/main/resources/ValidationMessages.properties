# Thông báo lỗi theo từng trường của Bean Validation. GlobalExceptionHandler đưa chúng
# thẳng vào data.fields và frontend hiện ngay dưới ô nhập, nên đây là chữ người dùng đọc.
# File này ghi đè bộ mặc định tiếng Anh của Hibernate Validator; khai báo message trực tiếp
# trên annotation vẫn được ưu tiên hơn.
#
# Lưu ý: file .properties đọc theo UTF-8 từ Java 9, nên viết tiếng Việt có dấu trực tiếp.

jakarta.validation.constraints.NotNull.message           = Không được để trống.
