spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/art_store}
    username: ${DB_USERNAME:art_store}
    password: ${DB_PASSWORD:art_store_dev}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

logging:
  level:
    org.hibernate.SQL: debug

app:
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    admin-email: ${APP_SEED_ADMIN_EMAIL:admin@tranh.local}
    admin-password: ${APP_SEED_ADMIN_PASSWORD:Admin@123456}
