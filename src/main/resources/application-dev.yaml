spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/art_store}
    username: ${DB_USERNAME:art_store}
    password: ${DB_PASSWORD:art_store_dev}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: debug
