services:
  postgres:
    image: postgres:17-alpine
    container_name: art-store-postgres
    environment:
      POSTGRES_DB: art_store
      POSTGRES_USER: art_store
      POSTGRES_PASSWORD: art_store_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U art_store -d art_store"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
