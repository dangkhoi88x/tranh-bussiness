# 30-api-proxy.sh chép file này vào /etc/nginx/api-proxy/ và thay __API_UPSTREAM__ bằng
# giá trị của biến môi trường API_UPSTREAM. Nhờ đi cùng origin với storefront, cookie
# refresh SameSite=Strict mới được trình duyệt gửi kèm và không cần cấu hình CORS.
location /api/ {
    proxy_pass __API_UPSTREAM__;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Thông báo đơn hàng cho admin là Server-Sent Events. Buffering mặc định của nginx
    # sẽ giữ lại từng event và làm luồng này im lặng chết, nên phải tắt.
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}
